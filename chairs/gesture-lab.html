<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesture Lab</title>
<link rel="stylesheet" href="reader.css">
<style>
  /* Camera on the left, controls and readouts on the right. */
  .lab {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr 360px;
  }
  @media (max-width: 1100px) {
    .lab { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .lab .panel { grid-column: 1 / -1; }
  }
  @media (max-width: 860px) {
    .lab { grid-template-columns: 1fr; grid-template-rows: 40vh 40vh 1fr; }
  }

  /* The map: the floor plan from floor.json, zoomed by the gesture. */
  .map {
    position: relative;
    overflow: hidden;
    background: var(--bg);
    border-left: var(--border-heavy);
  }
  @media (max-width: 860px) { .map { border-left: none; border-top: var(--border-heavy); } }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map .tag {
    position: absolute;
    top: var(--space-3);
    left: var(--space-3);
    padding: var(--space-1) var(--space-2);
    background: var(--ink);
    color: var(--on-accent);
    font-size: var(--text-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  /* Text sizes in floor units (the floor is 100 wide). */
  #map text { fill: var(--ink); font-family: var(--font-mono); text-rendering: geometricPrecision; }
  #map .v-room  { font-size: 1.8px; font-weight: 700; }
  #map .v-tag   { font-size: 1px; font-weight: 700; letter-spacing: 0.12em; fill: var(--ink-dim); }
  #map .v-count { font-size: 3px; font-family: var(--font-display); }
  #map .v-of    { font-size: 1.2px; }
  #map .v-label { font-size: 0.9px; }
  #map .dim     { fill: var(--ink-dim); }
  #map .v-owner { font-size: 1.2px; font-weight: 700; paint-order: stroke; stroke: var(--bg); stroke-width: 0.45px; stroke-linejoin: round; }

  .cam { position: relative; background: #000; overflow: hidden; }
  .cam video,
  .cam canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  /* The overlay flips with the video, so it is drawn in raw camera pixels. */
  .cam.flip-h video, .cam.flip-h canvas { transform: scaleX(-1); }
  .cam.flip-v video, .cam.flip-v canvas { transform: scaleY(-1); }
  .cam.flip-h.flip-v video, .cam.flip-h.flip-v canvas { transform: scale(-1, -1); }
  .cam .empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #d6d4d0;
    font-size: var(--text-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .cam .empty[hidden] { display: none; }

  .panel {
    min-height: 0;
    overflow: auto;
    padding: var(--space-4);
    border-left: var(--border-heavy);
    display: grid;
    align-content: start;
    gap: var(--space-6);
  }
  @media (max-width: 860px) { .panel { border-left: none; border-top: var(--border-heavy); } }
  .panel h2 { margin-bottom: var(--space-2); }

  /* Mock zoom: the level in big type, and a track with a needle at the zoom value. */
  .level {
    font-family: var(--font-display);
    font-size: var(--text-xl);
    line-height: 1;
    margin-bottom: var(--space-3);
  }
  .track {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border: var(--border);
    font-size: var(--text-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .track span { padding: var(--space-2); text-align: center; }
  .track span + span { border-left: 1px dotted var(--ink); }
  .track span.on { background: var(--ink); color: var(--on-accent); }
  .track i {
    position: absolute;
    top: -6px;
    bottom: -6px;
    width: 4px;
    margin-left: -2px;
    background: #e3271b;
    transition: left 60ms linear;
  }

  .modes label.row { align-items: flex-start; margin: var(--space-2) 0; }
  .modes small { display: block; color: var(--ink-dim); }

  .slider { display: grid; grid-template-columns: 1fr auto; gap: 0 var(--space-2); margin: var(--space-2) 0; }
  .slider input { grid-column: 1 / -1; accent-color: var(--ink); width: 100%; }
  .slider output { font-variant-numeric: tabular-nums; font-weight: 700; }
  .slider[hidden] { display: none; }

  .readout { font-variant-numeric: tabular-nums; }
  .readout div { padding: var(--space-1) 0; border-bottom: 1px dotted var(--ink); }
  .dot { display: inline-block; width: 10px; height: 10px; margin-right: var(--space-2); }

  #events { list-style: none; max-height: 12rem; overflow: auto; font-size: var(--text-xs); }
  #events li { padding: 2px 0; border-bottom: 1px dotted var(--ink); }
  #events time { color: var(--ink-dim); margin-right: var(--space-2); }
</style>
</head>
<body>
<header>
  <h1>Gesture Lab</h1>
  <div class="nav">
    <span id="status">Camera off</span>
    <label class="row check" style="margin:0"><input type="checkbox" id="flipH" checked> Flip H</label>
    <label class="row check" style="margin:0"><input type="checkbox" id="flipV" checked> Flip V</label>
    <button id="start">Start camera</button>
  </div>
</header>

<main class="lab">
  <div class="cam flip-h flip-v" id="cam">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="empty" id="empty">Press Start camera</div>
  </div>

  <div class="map" aria-label="Map">
    <svg id="map" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Floor plan, zoomed by the gesture"></svg>
    <span class="tag" id="mapTag">Table</span>
  </div>

  <aside class="panel">
    <section>
      <h2>Zoom</h2>
      <div class="level" id="level">Table</div>
      <div class="track" id="track"><span>Floor</span><span>Room</span><span>Table</span><i id="needle"></i></div>
    </section>

    <section class="modes">
      <h2>Gesture</h2>
      <div id="modes"></div>
    </section>

    <section>
      <h2>Tuning</h2>
      <div id="sliders"></div>
      <p><button class="ghost" id="reset">Reset</button> <button class="ghost" id="copy">Copy settings</button></p>
    </section>

    <section>
      <h2>Hands</h2>
      <div class="readout" id="handsOut"><span class="muted">No hands</span></div>
      <div class="readout muted" id="fps"></div>
    </section>

    <section>
      <h2>Events</h2>
      <ul id="events"></ul>
    </section>
  </aside>
</main>

<script type="module">
  // A test bench for zoom gestures, separate from the reader. Pick a gesture,
  // tune it with the sliders, and watch the mock zoom and the event log.
  // Nothing here affects reader.html.
  import { planMarkup } from './views.js';

  const VERSION = '0.10.14';
  const BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VERSION}`;
  const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

  const MODES = {
    drag:     ['One hand: pinch and drag', 'Pinch, then move the hand up to zoom in, down to zoom out. Let go to stop.'],
    sides:    ['One hand: pinch to step', 'Each pinch steps one level: right half of the view = in, left half = out.'],
    distance: ['Two hands: distance', 'Pinch both. The distance between them sets the zoom: close = floor, wide = table.'],
    spread:   ['Two hands: spread', 'Pinch both, then spread to zoom in, close to zoom out, from where you started.'],
  };

  // id, label, min, max, step, default, and the gesture it belongs to (none = all).
  const SLIDERS = [
    ['pinchOn',  'Pinch when tips closer than (cm)', 1, 6, 0.5, 3.5],
    ['pinchOff', 'Let go when tips further than (cm)', 2, 9, 0.5, 5.5],
    ['smooth',   'Smoothing (0 = raw, higher = steadier but laggier)', 0, 0.9, 0.05, 0.5],
    ['dead',     'Dead zone at level edges (levels)', 0, 0.4, 0.05, 0.15],
    ['drag',     'Drag distance per level (% of view height)', 5, 50, 1, 20, 'drag'],
    ['near',     'Floor when hands this close (% of view width)', 5, 40, 1, 15, 'distance'],
    ['far',      'Table when hands this far (% of view width)', 30, 90, 1, 55, 'distance'],
    ['sens',     'Levels per doubling of the spread', 0.5, 4, 0.25, 1.5, 'spread'],
  ];

  const LEVELS = ['Floor', 'Room', 'Table'];
  // Zoom runs 0–3: floor is 0–1, room 1–2, table 2–3.
  const MAX_Z = 2.999;
  const LOST_MS = 200;
  // A hand is the same hand as last frame if its wrist moved less than this (fraction of width).
  const MATCH = 0.15;
  // Same as the reader's hand overlay (hands.js); not red/green/blue, which mark chairs.
  const HAND_COLORS = ['#ff2bd6', '#ffb000', '#00c2d1', '#8a5cff'];
  const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                 [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

  const $ = id => document.getElementById(id);
  const video = $('video'), canvas = $('overlay'), ctx = canvas.getContext('2d');

  // ── Settings, remembered in this browser.

  const DEFAULTS = { mode: 'drag', ...Object.fromEntries(SLIDERS.map(s => [s[0], s[5]])) };
  let S = { ...DEFAULTS };
  try { Object.assign(S, JSON.parse(localStorage.getItem('gesture-lab') || '{}')); } catch {}
  const save = () => { try { localStorage.setItem('gesture-lab', JSON.stringify(S)); } catch {} };

  for (const [key, [title, help]] of Object.entries(MODES)) {
    const row = document.createElement('label');
    row.className = 'row check';
    row.innerHTML = `<input type="radio" name="mode" value="${key}"><span>${title}<small>${help}</small></span>`;
    row.querySelector('input').checked = S.mode === key;
    row.querySelector('input').addEventListener('change', () => { S.mode = key; save(); endGesture('gesture changed'); showSliders(); });
    $('modes').append(row);
  }

  const sliderRows = {};
  for (const [id, label, min, max, step, , mode] of SLIDERS) {
    const row = document.createElement('label');
    row.className = 'slider';
    row.dataset.mode = mode ?? '';
    row.innerHTML = `<span>${label}</span><output></output><input type="range" min="${min}" max="${max}" step="${step}">`;
    const input = row.querySelector('input'), out = row.querySelector('output');
    input.value = S[id];
    out.textContent = S[id];
    input.addEventListener('input', () => {
      S[id] = +input.value;
      // Letting go must need a wider gap than pinching, or it flickers.
      if (id === 'pinchOn' && S.pinchOff <= S.pinchOn) setSlider('pinchOff', S.pinchOn + 0.5);
      if (id === 'pinchOff' && S.pinchOff <= S.pinchOn) setSlider('pinchOn', S.pinchOff - 0.5);
      if (id === 'near' && S.far <= S.near) setSlider('far', S.near + 5);
      if (id === 'far' && S.far <= S.near) setSlider('near', S.far - 5);
      out.textContent = S[id];
      save();
    });
    $('sliders').append(row);
    sliderRows[id] = { input, out };
  }
  function setSlider(id, v) {
    S[id] = v;
    sliderRows[id].input.value = v;
    sliderRows[id].out.textContent = v;
  }
  function showSliders() {
    for (const row of $('sliders').children) row.hidden = !!row.dataset.mode && row.dataset.mode !== S.mode;
  }
  showSliders();

  $('reset').addEventListener('click', () => {
    const mode = S.mode;
    S = { ...DEFAULTS, mode };
    for (const [id] of SLIDERS) setSlider(id, S[id]);
    save();
  });
  $('copy').addEventListener('click', () => navigator.clipboard?.writeText(JSON.stringify(S, null, 2)));

  // ── Camera.

  let flipH = $('flipH').checked, flipV = $('flipV').checked;
  $('flipH').addEventListener('change', e => { flipH = e.target.checked; $('cam').classList.toggle('flip-h', flipH); });
  $('flipV').addEventListener('change', e => { flipV = e.target.checked; $('cam').classList.toggle('flip-v', flipV); });

  let stream = null, landmarker = null, run = 0;
  $('start').addEventListener('click', () => (stream ? stop() : start()));

  async function start() {
    $('start').disabled = true;
    try {
      if (!landmarker) {
        $('status').textContent = 'Loading hand model…';
        const { FilesetResolver, HandLandmarker } = await import(`${BASE}/vision_bundle.mjs`);
        const fileset = await FilesetResolver.forVisionTasks(`${BASE}/wasm`);
        const make = delegate => HandLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: 'VIDEO', numHands: 2,
        });
        try { landmarker = await make('GPU'); } catch { landmarker = await make('CPU'); }
      }
      $('status').textContent = 'Requesting camera…';
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      video.srcObject = stream;
      await video.play();
      $('empty').hidden = true;
      $('start').textContent = 'Stop camera';
      $('status').textContent = 'Tracking';
      const r = ++run;
      requestAnimationFrame(() => loop(r));
    } catch (err) {
      console.error(err);
      stream?.getTracks().forEach(t => t.stop());
      stream = null;
      $('status').textContent = 'Error: ' + err.message;
    }
    $('start').disabled = false;
  }

  function stop() {
    run++;
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.srcObject = null;
    hands.clear();
    endGesture('camera stopped');
    renderMapHands();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    $('empty').hidden = false;
    $('start').textContent = 'Start camera';
    $('status').textContent = 'Camera off';
    renderHands();
  }

  // ── Tracking.

  // key → { lm, gap (m), pinched, p (pinch point, 0–1 as displayed), raw (0–1 unflipped), wrist, seen, color }
  const hands = new Map();
  let nextKey = 1, lastTs = 0, frames = 0, fpsSince = performance.now();

  function loop(r) {
    if (r !== run) return;
    const now = performance.now();
    if (video.readyState >= 2) {
      lastTs = Math.max(now, lastTs + 1);
      const res = landmarker.detectForVideo(video, lastTs);
      track(res, now);
      frames++;
    }
    if (now - fpsSince > 1000) {
      $('fps').textContent = `${Math.round((frames * 1000) / (now - fpsSince))} detections / s`;
      frames = 0; fpsSince = now;
    }
    draw();
    requestAnimationFrame(() => loop(r));
  }

  // As displayed, so "right half" and "up" match what you see.
  const shown = p => ({ x: flipH ? 1 - p.x : p.x, y: flipV ? 1 - p.y : p.y });

  function track(res, now) {
    const aspect = video.videoWidth / video.videoHeight;
    const found = res.landmarks.map((lm, i) => ({ lm, world: res.worldLandmarks?.[i], key: null }));

    // Match to last frame's hands by wrist position, nearest first.
    const pairs = [];
    found.forEach((f, i) => {
      for (const [key, h] of hands) {
        pairs.push({ i, key, d: Math.hypot((f.lm[0].x - h.lm[0].x) * aspect, f.lm[0].y - h.lm[0].y) / aspect });
      }
    });
    pairs.sort((a, b) => a.d - b.d);
    const used = new Set();
    for (const p of pairs) {
      if (found[p.i].key != null || used.has(p.key) || p.d > MATCH) continue;
      found[p.i].key = p.key;
      used.add(p.key);
    }

    const started = [];
    for (const f of found) {
      const isNew = f.key == null;
      f.key ??= nextKey++;
      const prev = hands.get(f.key);
      const { lm, world } = f;
      // Thumb–index gap in metres from the 3D world landmarks (fallback: image, wrist–knuckle ≈ 9 cm).
      let gap = world
        ? Math.hypot(world[4].x - world[8].x, world[4].y - world[8].y, world[4].z - world[8].z)
        : 0.09 * Math.hypot((lm[4].x - lm[8].x) * aspect, lm[4].y - lm[8].y) / (Math.hypot((lm[0].x - lm[9].x) * aspect, lm[0].y - lm[9].y) || 1);
      let raw = { x: (lm[4].x + lm[8].x) / 2, y: (lm[4].y + lm[8].y) / 2 };
      const a = S.smooth;
      if (prev) {
        gap = prev.gap * a + gap * (1 - a);
        raw = { x: prev.raw.x * a + raw.x * (1 - a), y: prev.raw.y * a + raw.y * (1 - a) };
      }
      const pinched = prev?.pinched ? gap * 100 < S.pinchOff : gap * 100 < S.pinchOn;
      const h = { lm, gap, pinched, raw, p: shown(raw), seen: now, color: HAND_COLORS[(f.key - 1) % HAND_COLORS.length] };
      hands.set(f.key, h);
      if (isNew) log(`hand ${f.key} appeared`);
      if (pinched && !prev?.pinched) { started.push(h); log(`hand ${f.key} pinch (${(gap * 100).toFixed(1)} cm)`); }
      if (!pinched && prev?.pinched) log(`hand ${f.key} let go (${(gap * 100).toFixed(1)} cm)`);
    }
    for (const [key, h] of hands) {
      if (now - h.seen > LOST_MS) { hands.delete(key); log(`hand ${key} lost${h.pinched ? ' while pinching' : ''}`); }
    }
    gesture(started);
    renderHands();
    renderMapHands();
  }

  // ── Gestures. Each sets the zoom z (0–3).

  let z = 2.5, level = 2, g = null;

  function gesture(started) {
    const aspect = video.videoWidth / video.videoHeight;
    const pinched = [...hands.entries()].filter(([, h]) => h.pinched);
    const span = () => {
      const [a, b] = pinched.map(([, h]) => h.p);
      return Math.hypot(a.x - b.x, (a.y - b.y) / aspect); // fraction of view width
    };
    const mid = () => {
      const [a, b] = pinched.map(([, h]) => h.p);
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    };
    // Each gesture zooms into the point where it started (focus), so the map
    // zooms into what you pinched over and doesn't drift as the hands move.

    switch (S.mode) {
      case 'drag': {
        const h = g && hands.get(g.key);
        if (g && h?.pinched) setZ(g.z0 + (g.y0 - h.p.y) / (S.drag / 100));
        else {
          if (g) endGesture('let go');
          const first = pinched[0];
          if (first) {
            g = { key: first[0], y0: first[1].p.y, raw0: first[1].raw, z0: z };
            focus = first[1].p;
            log(`drag started on hand ${first[0]}`);
          }
        }
        break;
      }
      case 'sides': {
        for (const h of started) {
          const step = h.p.x >= 0.5 ? 1 : -1;
          focus = h.p;
          setLevel(Math.max(0, Math.min(2, level + step)));
          log(`step ${step > 0 ? 'in' : 'out'} (pinch on ${step > 0 ? 'right' : 'left'} half)`);
        }
        break;
      }
      case 'distance': {
        if (pinched.length === 2) {
          if (!g) { g = {}; focus = mid(); log('two-hand zoom started'); }
          const s = span() * 100;
          setZ((3 * (s - S.near)) / (S.far - S.near));
        } else if (g) endGesture('let go');
        break;
      }
      case 'spread': {
        if (pinched.length === 2) {
          const s = Math.max(0.02, span());
          if (!g) { g = { s0: s, z0: z }; focus = mid(); log('two-hand zoom started'); }
          setZ(g.z0 + S.sens * Math.log2(s / g.s0));
        } else if (g) endGesture('let go');
        break;
      }
    }
  }

  function endGesture(why) {
    if (g) log(`zoom ended: ${why}`);
    g = null;
  }

  // The level shown only changes once z is past the edge by the dead zone,
  // so jitter at an edge doesn't flip it back and forth.
  function setZ(v) {
    z = Math.max(0, Math.min(MAX_Z, v));
    const raw = Math.floor(z);
    if (raw !== level) {
      const edge = Math.max(raw, level);
      if (Math.abs(raw - level) > 1 || Math.abs(z - edge) >= S.dead) setLevel(raw, true);
    }
    renderZoom();
  }

  function setLevel(n, keepZ) {
    if (n !== level) log(`level → ${LEVELS[n].toUpperCase()}`);
    level = n;
    if (!keepZ) z = n + 0.5;
    renderZoom();
  }

  // ── Map: the floor plan, drawn with the reader's own drawing code.
  // The camera view stands for the map: a hand at the upper right of the camera
  // is over the upper right of the map, shown as a dot. Zooming keeps the point
  // under the pinch fixed, so you zoom into whatever you pinch over.
  // How wide the view is at each level comes from four frames: the whole floor
  // (z 0), the live room (1), its first table with chairs (2), and that table
  // close up (3). The stops' centres only set where the map starts.

  let stops = null, plan = null, floorSize = [100, 62];
  let view = null;   // { cx, cy, w } in floor units
  let focus = null;  // where the gesture is, 0–1 of the camera view as displayed
  try {
    const floor = await fetch('floor.json').then(r => r.json());
    const live = floor.rooms.find(r => r.live) ?? floor.rooms[0];
    const [rx, ry, rw, rh] = live.rect;
    const [tx, ty, tw, th] = live.tables[0].rect;
    const table = { x: rx + tx * rw, y: ry + ty * rh, w: tw * rw, h: th * rh };
    const box = (x, y, w, h, m = 0) => ({ cx: x + w / 2, cy: y + h / 2, w: w * (1 + 2 * m), h: h * (1 + 2 * m) });
    stops = [
      box(0, 0, floor.size[0], floor.size[1], 0.03),
      box(rx, ry, rw, rh, 0.06),
      box(table.x, table.y - table.h * 0.3, table.w, table.h * 2.6, 0.08),
      box(table.x + table.w * 0.25, table.y - table.h * 0.15, table.w * 0.5, table.h * 1.6),
    ];
    floorSize = floor.size;
    plan = planMarkup(floor);
    $('map').innerHTML = plan + '<g id="mapHands"></g>';
  } catch (err) {
    console.error(err);
    $('map').innerHTML = '<text x="2" y="6" style="font-size:3px">Could not load floor.json — serve this folder over HTTP</text>';
    $('map').setAttribute('viewBox', '0 0 100 60');
  }

  // View width at zoom z: changes geometrically between stops (even zoom speed).
  function widthAt(zz) {
    const i = Math.min(2, Math.floor(zz)), t = zz - i;
    return stops[i].w ** (1 - t) * stops[i + 1].w ** t;
  }

  // Height ÷ width of the map pane; the view always matches it, so nothing is letterboxed.
  const paneAspect = () => {
    const r = $('map').getBoundingClientRect();
    return r.width ? r.height / r.width : 0.6;
  };
  // A point on the camera view (0–1) → the floor point under it on the map.
  const toMap = p => {
    const h = view.w * paneAspect();
    return { x: view.cx - view.w / 2 + p.x * view.w, y: view.cy - h / 2 + p.y * h };
  };

  function renderMap() {
    if (!stops) return;
    const w = widthAt(z);
    if (!view) {
      // Start centred where the stops put this zoom.
      const i = Math.min(2, Math.floor(z)), t = z - i, a = stops[i], b = stops[i + 1];
      view = { cx: a.cx + (b.cx - a.cx) * t, cy: a.cy + (b.cy - a.cy) * t, w };
    } else if (w !== view.w) {
      // Keep the point under the pinch where it is, scaling everything else around it.
      const F = focus ? toMap(focus) : { x: view.cx, y: view.cy };
      const s = w / view.w;
      view = { cx: F.x + (view.cx - F.x) * s, cy: F.y + (view.cy - F.y) * s, w };
    }
    // Don't let the view wander off the floor.
    view.cx = Math.max(0, Math.min(floorSize[0], view.cx));
    view.cy = Math.max(0, Math.min(floorSize[1], view.cy));
    const h = w * paneAspect();
    $('map').setAttribute('viewBox', `${view.cx - w / 2} ${view.cy - h / 2} ${w} ${h}`);
    renderMapHands();
  }

  // Each hand as a dot on the map at the point it is over: hollow when open,
  // filled when pinching. While zooming, a ring marks the point being zoomed into.
  function renderMapHands() {
    const g = document.getElementById('mapHands');
    if (!g || !view) return;
    const r = view.w * 0.012;
    let s = '';
    for (const h of hands.values()) {
      const p = toMap(h.p);
      s += `<circle cx="${p.x}" cy="${p.y}" r="${r}" style="fill:${h.pinched ? h.color : 'var(--bg)'};stroke:${h.color};stroke-width:${r * 0.4}"/>`;
    }
    if (g0() && focus) {
      const p = toMap(focus);
      s += `<circle cx="${p.x}" cy="${p.y}" r="${r * 2.2}" style="fill:none;stroke:var(--ink);stroke-width:${r * 0.3};stroke-dasharray:${r * 0.5} ${r * 0.5}"/>` +
        `<path d="M${p.x - r * 3.2} ${p.y}h${r * 2}M${p.x + r * 1.2} ${p.y}h${r * 2}M${p.x} ${p.y - r * 3.2}v${r * 2}M${p.x} ${p.y + r * 1.2}v${r * 2}" style="stroke:var(--ink);stroke-width:${r * 0.3}"/>`;
    }
    g.innerHTML = s;
  }
  window.addEventListener('resize', renderMap);

  // Whether a gesture is under way (sides mode has none; it steps on each pinch).
  const g0 = () => g != null;

  // ── Display.

  function renderZoom() {
    $('level').textContent = LEVELS[level];
    $('mapTag').textContent = `${LEVELS[level]} · z ${z.toFixed(2)}`;
    $('needle').style.left = `${(z / 3) * 100}%`;
    [...$('track').children].forEach((el, i) => el.classList?.toggle('on', i === level));
    renderMap();
  }

  function renderHands() {
    const box = $('handsOut');
    box.replaceChildren();
    if (!hands.size) { box.innerHTML = '<span class="muted">No hands</span>'; return; }
    for (const [key, h] of hands) {
      const row = document.createElement('div');
      row.innerHTML = `<span class="dot" style="background:${h.color}"></span>Hand ${key} — ` +
        `${(h.gap * 100).toFixed(1)} cm — <b>${h.pinched ? 'PINCH' : 'open'}</b> — ` +
        `x ${(h.p.x * 100).toFixed(0)}% y ${(h.p.y * 100).toFixed(0)}%`;
      box.append(row);
    }
  }

  function log(text) {
    const li = document.createElement('li');
    const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    li.innerHTML = `<time>${t}</time>`;
    li.append(text);
    $('events').prepend(li);
    while ($('events').children.length > 60) $('events').lastChild.remove();
  }

  // Drawn in raw camera pixels; the canvas is flipped with the video by CSS.
  function draw() {
    const W = video.videoWidth, H = video.videoHeight;
    if (!W) return;
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    ctx.clearRect(0, 0, W, H);
    const s = W / 960;
    const line = (pts, width, color) => {
      ctx.beginPath();
      pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.lineWidth = width; ctx.strokeStyle = color; ctx.stroke();
    };
    const px = p => [p.x * W, p.y * H];

    // Two-hand gestures: the line between the pinch points.
    const pinched = [...hands.values()].filter(h => h.pinched);
    if ((S.mode === 'distance' || S.mode === 'spread') && pinched.length === 2) {
      ctx.setLineDash([6 * s, 8 * s]);
      line(pinched.map(h => px(h.raw)), 5 * s, '#000');
      line(pinched.map(h => px(h.raw)), 2 * s, '#fff');
      ctx.setLineDash([]);
    }
    // Drag: a line from where the drag started to the hand now.
    if (S.mode === 'drag' && g) {
      const h = hands.get(g.key);
      if (h) {
        ctx.setLineDash([6 * s, 8 * s]);
        line([px(g.raw0), px(h.raw)], 5 * s, '#000');
        line([px(g.raw0), px(h.raw)], 2 * s, '#fff');
        ctx.setLineDash([]);
      }
    }

    for (const h of hands.values()) {
      for (const [a, b] of BONES) {
        line([px(h.lm[a]), px(h.lm[b])], 4 * s, '#000');
        line([px(h.lm[a]), px(h.lm[b])], 2 * s, h.color);
      }
      for (const p of h.lm) {
        ctx.beginPath(); ctx.arc(p.x * W, p.y * H, 3 * s, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();
      }
      // Pinch point: hollow when open, filled when pinching.
      const [x, y] = px(h.raw);
      ctx.beginPath(); ctx.arc(x, y, 10 * s, 0, Math.PI * 2);
      ctx.lineWidth = 3 * s; ctx.strokeStyle = '#000'; ctx.stroke();
      ctx.fillStyle = h.pinched ? h.color : 'rgba(255,255,255,0.6)';
      ctx.fill();
    }
  }

  renderZoom();
</script>
</body>
</html>
