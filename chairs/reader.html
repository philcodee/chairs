<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chair Reader</title>
<link rel="stylesheet" href="reader.css">
</head>
<body>
<header>
  <h1>Chair Reader</h1>
  <div class="nav">
    <span id="status">Camera off</span>
    <div class="levels" role="group" aria-label="Zoom level">
      <button class="ghost" data-level="floor" aria-pressed="false">Floor</button>
      <button class="ghost" data-level="room" aria-pressed="false">Room</button>
      <button class="ghost" data-level="table" aria-pressed="true">Table</button>
    </div>
    <div class="split" id="split">
      <button id="start">Start camera</button>
      <button id="menuToggle" class="arrow" aria-label="Camera options" aria-haspopup="true" aria-expanded="false" aria-controls="menu">▾</button>
      <div class="menu" id="menu" hidden>
        <label class="row check">
          <input type="checkbox" id="flipV" checked> Flip camera image vertically
        </label>
        <label class="row check">
          <input type="checkbox" id="flipH" checked> Flip camera image horizontally
        </label>
        <label class="row check">
          <input type="checkbox" id="handsOn" checked> Pinch to zoom with hand tracking
        </label>      </div>
    </div>
    <button class="ghost" id="showStates" aria-pressed="false" aria-controls="drawer">Show states</button>
  </div>
</header>

<main class="stage flip-v flip-h" id="stage" data-level="table">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div class="empty" id="empty">Press Start camera to begin scanning</div>

  <!-- Room and floor views cover the camera when zoomed out; the camera keeps scanning underneath. -->
  <div class="views" id="views">
    <svg id="roomView" role="img" aria-label="Room view"></svg>
    <svg id="floorView" role="img" aria-label="Floor plan"></svg>
  </div>
  <canvas id="hands" aria-hidden="true"></canvas>

  <!-- States drawer: slides in from the right when "Show states" is on. -->
  <aside class="drawer" id="drawer" aria-label="States">
    <div class="seats" id="seats"></div>
    <h2>State</h2>
    <div id="state"><span class="muted">No objects in view</span></div>
    <h2>Change log</h2>
    <ul id="log"></ul>
    <p><button class="ghost" id="copy">Copy state JSON</button></p>
  </aside>
</main>

<script type="module" src="reader.js"></script>
</body>
</html>
